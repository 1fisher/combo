# combo 中转服务器 (combo-relay) — nginx 反向代理
#
# 架构:
#   proxy.apesoft.cn 上只运行 combo-relay(不跑 crush/combo-proxy)
#   桌面客户端通过 WebSocket 连出到中转建立反向隧道
#   手机/Web 的请求经中转透传到桌面客户端
#
# 部署路径: /etc/nginx/conf.d/combo-relay.example.conf
# (注意:本机 nginx.conf 只 include conf.d/*.conf,sites-enabled 被注释)
#
# 证书由 acme.sh + ZeroSSL 签发(本服务器无法直连 Let's Encrypt API):
#   ~/.acme.sh/acme.sh --issue -d proxy.apesoft.cn --webroot /var/www/html --server zerossl
# 证书路径: /etc/combo-certs/proxy.apesoft.cn/{fullchain,key}.pem

# ---------- HTTP (acme 验证 + 重定向到 HTTPS) ----------
server {
    listen 80;
    listen [::]:80;
    server_name proxy.apesoft.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (反代到 combo-relay :8080) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name proxy.apesoft.cn;

    ssl_certificate     /etc/combo-certs/proxy.apesoft.cn/fullchain.pem;
    ssl_certificate_key /etc/combo-certs/proxy.apesoft.cn/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # combo-relay 监听在 127.0.0.1:8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket 支持(隧道连接 + 终端)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 透传客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应 + WebSocket 长连接
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # 长连接超时(隧道 WebSocket 是持久连接,需要超长超时)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
