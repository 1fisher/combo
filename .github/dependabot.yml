# Dependabot 自动依赖更新配置
# 参见 https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # ── npm 依赖(package.json / package-lock.json)──
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    versioning-strategy: increase # 直接 bump package.json 的 semver 范围,而非只改 lock
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # 开发依赖的 patch/minor 合并为一个 PR,减少噪音
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
      # 运行时依赖的 patch 合并为一个 PR
      runtime-patches:
        dependency-type: "production"
        update-types:
          - "patch"

  # ── Rust 依赖(Cargo.toml / Cargo.lock)──
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    versioning-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      # patch 更新合并为一个 PR
      patch-updates:
        update-types:
          - "patch"

  # ── GitHub Actions 工作流 ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
