name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_type:
        description: 版本类型
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      prerelease:
        description: 标记为预发布
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── CI: 前端 + 后端检查(push main / PR,跳过 tag) ───────────────────
  ci-frontend:
    name: CI Frontend
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tsc
      - run: npm test
      - run: npm run build

  ci-backend:
    name: CI Backend
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/combo-cli
            src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # tauri-build 的 build script 会在编译期校验 bundle.resources 里的 ../dist
      # (src-tauri/tauri.conf.json 的 {"../dist/": "dist/"})——不存在即报
      # "resource path `../dist` doesn't exist"。因此必须先构建前端产物。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build frontend (dist/ required by tauri-build)
        run: |
          npm ci
          npm run build

      - run: cargo check --workspace --verbose
      - run: cargo test --workspace --verbose

  # ─── 版本 bump + tag(workflow_dispatch 专用) ──────────────────────────
  bump-version:
    name: Bump Version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump version
        id: bump
        run: |
          bash scripts/version.sh ${{ inputs.version_type }}
          NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          RANGE="${PREV_TAG:+$PREV_TAG..HEAD}"
          RANGE="${RANGE:-HEAD}"
          {
            echo "content<<CHANGELOG_EOF"
            echo "## 变更内容"
            echo ""
            git log "${RANGE}" --pretty=format:"- %s (%h)" --no-merges
            echo ""
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**完整变更**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.bump.outputs.tag }}"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Commit, tag and push
        run: |
          git add -A
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          TAG="${{ steps.bump.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG" -m "${{ steps.changelog.outputs.content }}"
          git push origin main
          git push origin "$TAG"

  # ─── 多平台构建(tag push 或 workflow_dispatch 后) ─────────────────────
  build:
    name: Build (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
          # Windows 暂不支持:combo-cli 依赖 Unix 风格路径与符号链接
          # - platform: windows-x86_64
          #   runner: windows-latest
          #   target: x86_64-pc-windows-msvc
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/combo-cli
            src-tauri

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci

      # macOS 代码签名 + 公证(可选):在 GitHub Secrets 配置以下 6 项后自动生效,
      # 构建即为「Developer ID 签名 + 已公证」,下载可正常双击打开,且 TCC 隐私
      # 权限(麦克风/文件夹等)按稳定签名身份记录,系统设置里能正常列出 Combo。
      # 未配置时本步跳过、env 不注入,tauri-cli 回退为 ad-hoc 签名
      # (tauri.conf.json 的 signingIdentity "-"),首次打开需右键 → 打开。
      # 注意:必须用 if 条件守卫,不能直接 env: ${{ secrets.X }} —— 未配置的
      # secret 会变成空字符串环境变量,tauri-cli 视其为「已设置」,导入空证书
      # 直接构建失败(此前 c85d514 回退的原因)。
      - name: Export Apple signing secrets
        if: env.HAS_APPLE_SIGNING == 'true'
        run: |
          echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater 签名(用于自动更新校验)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Combo ${{ github.ref_name }}'
          releaseBody: 'See assets below.'
          releaseDraft: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}

  # ─── 发布 Release(所有构建完成后) ─────────────────────────────────────
  publish-release:
    name: Publish Release
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "⚠️ 部分构建失败,仍发布已上传的产物"
          fi
          gh release edit "$TAG" --draft=false 2>/dev/null || echo "Release $TAG 可能已发布"
          echo "✓ Release $TAG 已发布"
