name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_type:
        description: 版本类型
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      prerelease:
        description: 标记为预发布
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── CI: 前端 + 后端检查(push main / PR,跳过 tag) ───────────────────
  ci-frontend:
    name: CI Frontend
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tsc
      - run: npm test
      - run: npm run build

  ci-backend:
    name: CI Backend
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/combo-proxy
            src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: cargo check --workspace --verbose
      - run: cargo test --workspace --verbose

  # ─── 版本 bump + tag(workflow_dispatch 专用) ──────────────────────────
  bump-version:
    name: Bump Version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump version
        id: bump
        run: |
          bash scripts/version.sh ${{ inputs.version_type }}
          NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          RANGE="${PREV_TAG:+$PREV_TAG..HEAD}"
          RANGE="${RANGE:-HEAD}"
          {
            echo "content<<CHANGELOG_EOF"
            echo "## 变更内容"
            echo ""
            git log "${RANGE}" --pretty=format:"- %s (%h)" --no-merges
            echo ""
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**完整变更**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.bump.outputs.tag }}"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Commit, tag and push
        run: |
          git add -A
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          TAG="${{ steps.bump.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG" -m "${{ steps.changelog.outputs.content }}"
          git push origin main
          git push origin "$TAG"

  # ─── 多平台构建(tag push 或 workflow_dispatch 后) ─────────────────────
  build:
    name: Build (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
          # Windows 暂不支持:combo-proxy 使用 Unix domain socket
          # - platform: windows-x86_64
          #   runner: windows-latest
          #   target: x86_64-pc-windows-msvc
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/combo-proxy
            src-tauri

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater 签名(用于自动更新校验)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名:配置 Apple Secrets 后取消注释
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Combo ${{ github.ref_name }}'
          releaseBody: 'See assets below.'
          releaseDraft: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}

  # ─── 发布 Release(所有构建完成后) ─────────────────────────────────────
  publish-release:
    name: Publish Release
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "⚠️ 部分构建失败,仍发布已上传的产物"
          fi
          gh release edit "$TAG" --draft=false 2>/dev/null || echo "Release $TAG 可能已发布"
          echo "✓ Release $TAG 已发布"
