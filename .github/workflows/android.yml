name: Android APK

# 手动触发构建 Combo Android 壳(Capacitor)Debug APK。
# Debug 包可直接安装体验;正式发布(release 签名)待签名配置后接入 release.yml。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest # runner 自带 Android SDK 与 build-tools
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端(dist/)
        run: npm run build

      - name: 同步 Web 资源到 Android 工程
        run: npx cap sync android

      - name: 构建 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: combo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
