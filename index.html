<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combo</title>
    <!-- 启动画面(加载动画):纯 CSS + vanilla JS(public/splash.js),不依赖 React,
         在 bundle 下载/解析期间即可展示。React 挂载完成后由 main.tsx 派发
         combo:app-ready 事件,splash 收尾(粒子合并成图标 → 流光 combo → 淡出)。
         样式内嵌保证首屏零请求立即可见;深色背景与 --background(dark) 对齐,
         淡出时不闪白。 -->
    <style>
      #combo-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        /* 对齐 .dark 的 --background: oklch(0.16 0.012 260) ≈ #101116 */
        background: #101116;
        color: #dfe3ee;
        font-family:
          'Geist Variable',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        transition: opacity 0.55s ease;
        -webkit-user-select: none;
        user-select: none;
      }
      #combo-splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #combo-splash-canvas {
        width: min(52vw, 200px);
        height: min(52vw, 200px);
        display: block;
      }
      /* 底部区:进度条与流光单词 grid 叠放同一格,完成后无缝切换、无布局跳动 */
      #combo-splash-bottom {
        display: grid;
        place-items: center;
        width: min(56vw, 232px);
      }
      #combo-splash-bottom > * {
        grid-area: 1 / 1;
      }
      /* 进度区:完成后整体淡出,给流光单词让位 */
      #combo-splash-progress {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
        transition: opacity 0.4s ease;
      }
      #combo-splash.is-assembled #combo-splash-progress {
        opacity: 0;
      }
      #combo-splash-bar {
        width: 100%;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      #combo-splash-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #5494ff, #8f7bff 55%, #b7a6ff);
        box-shadow: 0 0 10px rgba(122, 140, 255, 0.55);
        transition: width 0.18s ease-out;
      }
      #combo-splash-percent {
        font-size: 12px;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
        color: rgba(223, 227, 238, 0.62);
      }
      /* 流光 combo 单词:完成后在图标下方浮现。渐变高光沿文字横向循环扫过。 */
      #combo-splash-word {
        font-size: clamp(26px, 6vw, 40px);
        font-weight: 650;
        letter-spacing: 0.14em;
        line-height: 1;
        padding-left: 0.14em; /* 抵消最后一个字符的字距,保证视觉居中 */
        background-image: linear-gradient(
          100deg,
          #56617a 18%,
          #86a5ff 36%,
          #ffffff 50%,
          #a3b4ff 64%,
          #56617a 82%
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.45s ease,
          transform 0.45s ease;
      }
      #combo-splash.is-assembled #combo-splash-word {
        opacity: 1;
        transform: translateY(0);
        animation: combo-splash-shimmer 1.5s linear infinite;
      }
      @keyframes combo-splash-shimmer {
        from {
          background-position: 120% 0;
        }
        to {
          background-position: -120% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #combo-splash.is-assembled #combo-splash-word {
          animation: none;
        }
        #combo-splash {
          transition-duration: 0.15s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="combo-splash" role="status" aria-label="正在加载 Combo">
      <canvas id="combo-splash-canvas" aria-hidden="true"></canvas>
      <div id="combo-splash-bottom">
        <div id="combo-splash-word" aria-hidden="true">combo</div>
        <div id="combo-splash-progress">
          <div id="combo-splash-bar"><div id="combo-splash-bar-fill"></div></div>
          <div id="combo-splash-percent">0%</div>
        </div>
      </div>
    </div>
    <!-- 非 module 立即执行,先于 type=module 的 main.tsx,保证进度事件监听就位 -->
    <script src="/splash.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
