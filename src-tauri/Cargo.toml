[package]
name = "combo"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
combo-proxy = { path = "../crates/combo-proxy" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "combo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
