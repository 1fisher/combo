[package]
name = "combo"
version = "0.2.19"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
# 托盘忙碌动画:解码 tray-icon.png 并程序化生成动画帧(仅用 png 解码)
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
open = "5"
combo-cli = { path = "../crates/combo-cli" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "combo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 桌面端二进制改名 combo-app,把 `combo` 命令名让给 CLI
# (cargo install combo-cli 后全局可用 `combo serve` / `combo ask`);
# 打包产物内二进制名由 tauri.conf.json 的 mainBinaryName("Combo")控制。
[[bin]]
name = "combo-app"
path = "src/main.rs"
