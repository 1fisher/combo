<!doctype html>
<!-- 编译期内嵌的兜底页(frontendDist 指向本目录,内容保持稳定):
     真实前端 dist/ 经 bundle.resources 随包分发,运行时由 ResourceFirstAssets
     优先从磁盘加载;仅当磁盘 dist 缺失(如裸跑二进制且未 npm run build)时
     才会看到本页。不要把构建产物放进本目录,否则前端变更会重新触发 Rust 编译。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Combo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        color: #e6e6e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        max-width: 460px;
        padding: 32px;
        text-align: center;
        line-height: 1.9;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
        font-weight: 600;
      }
      code {
        background: #1a1d23;
        border: 1px solid #2a2e36;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>前端资源未找到</h1>
      <p>
        应用未能定位到前端资源(dist/)。<br />
        开发模式请先执行 <code>npm run build</code>,或使用 <code>cargo tauri dev</code>;<br />
        安装版遇到该提示,请重新下载安装包。
      </p>
    </div>
  </body>
</html>
