[package]
name = "combo-cli"
version = "0.2.14"
edition = "2021"
license = "MIT"
description = "combo 自有 agent CLI:基于 rig 的多 provider 智能体命令行工具"

[[bin]]
name = "combo"
path = "src/main.rs"

[dependencies]
rig = { version = "0.41", features = ["rmcp", "memory"] }
rmcp = { version = "2.2", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "cookies", "stream"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
futures = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", features = ["ws"] }
async-trait = "0.1"
chrono = "0.4"
toml = "0.8"
dirs = "6"
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
glob = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
portable-pty = "0.8"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
base64 = "0.22"
hex = "0.4"
which = "7"
webrtc = "0.20.3"
sherpa-onnx = "1.13.5"
tar = "0.4"
bzip2 = { version = "0.4", features = ["static"] }

[dev-dependencies]
tempfile = "3"
